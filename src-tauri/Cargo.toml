[package]
name = "local-cam-viewer"
version = "0.1.0"
description = "Local live camera viewer"
authors = ["Local Cam"]
edition = "2024"

[lib]
name = "local_cam_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-stream = "0.3"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
getrandom = "0.3"
keyring = "4.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
subtle = "2.6"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "sync", "time"] }
url = "2"
